# Trino single node (coordinator + worker), sized low for a 4 GB WSL machine that also runs
# Airflow: run Trino when you need it (it does not restart on its own, see compose.yaml).
# Based on the defaults of trinodb/trino:484; only the memory settings below are added.
#
# Memory (see also jvm.config, which has no comments because the JVM does not allow them there):
#   JVM heap                       768 MB  -Xms768M/-Xmx768M (the image default sizes it at 80%
#                                          of the container limit; a fixed heap is predictable)
#   query.max-memory-per-node      384 MB  user memory one query may use on this node
#   query.max-memory               384 MB  same value: there is only one node
#   memory.heap-headroom-per-node  192 MB  heap kept free for Trino's own allocations
#   Trino requires per-node + headroom < heap: 384 MB + 192 MB = 576 MB < 768 MB.
#   Container mem_limit 1.2 GB = 768 MB heap + about 450 MB outside the heap (metaspace, threads,
#   JIT code cache, which is lowered from the image's 256 MB to 128 MB in jvm.config).
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

query.max-memory-per-node=384MB
query.max-memory=384MB
memory.heap-headroom-per-node=192MB
