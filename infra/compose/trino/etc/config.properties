# Trino single node (coordinator + worker) for a 4 GB WSL machine.
# Based on the defaults of trinodb/trino:484; only the memory settings below are added.
#
# Memory (see also jvm.config, which has no comments because the JVM does not allow them there):
#   JVM heap                       1 GB    -Xms1G/-Xmx1G (the image default sizes it at 80% of
#                                          the container limit; a fixed heap is predictable)
#   query.max-memory-per-node      512 MB  user memory one query may use on this node
#   query.max-memory               512 MB  same value: there is only one node
#   memory.heap-headroom-per-node  256 MB  heap kept free for Trino's own allocations
#   Trino requires per-node + headroom < heap: 512 MB + 256 MB = 768 MB < 1024 MB.
#   Container mem_limit 1536 MB = 1 GB heap + about 0.5 GB outside the heap (metaspace, threads,
#   JIT code cache, which is lowered from the image's 256 MB to 128 MB in jvm.config).
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

query.max-memory-per-node=512MB
query.max-memory=512MB
memory.heap-headroom-per-node=256MB
