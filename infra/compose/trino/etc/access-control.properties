# File-based access control (dev Trino only; prod Trino has none, it lives inside the CI job).
# Trino here has no authentication, so the user name is whatever the client says: this is a
# guard against accidental writes by AI tooling, not a security boundary (ADR-0013).
# The dbt MCP server and make docs-draft connect as wanderlake_mcp, which can only read; every
# other user (dbt, Airflow, the CLI) keeps full access. Rules: rules.json.
access-control.name=file
security.config-file=/etc/trino/rules.json
