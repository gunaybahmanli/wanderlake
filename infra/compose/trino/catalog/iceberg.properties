# Trino catalog "iceberg" (the file name): Apache Iceberg tables. See docs/adr/0003.
# Property names verified against the Trino 484 docs (Iceberg connector, metastores, S3 file system).
# Secrets come from the container environment via ${ENV:...}; nothing secret is committed.
connector.name=iceberg

# The same file serves dev (Docker Compose) and prod (GitHub Actions, ADR-0012); only the
# environment differs:
#   ICEBERG_CATALOG_JDBC_URL  dev:  jdbc:postgresql://postgres:5432/iceberg_catalog
#                             prod: the Supabase session pooler, database postgres, with
#                                   currentSchema=iceberg_catalog&sslmode=require
#   S3_ENDPOINT               dev: http://seaweedfs:8333   prod: the Cloudflare R2 endpoint
#   S3_REGION                 dev: us-east-1               prod: auto
#
# Metadata catalog: Iceberg JDBC catalog (own role, catalog tables only).
# Catalog name (stored in the catalog_name column) comes from ICEBERG_CATALOG_NAME, the same
# variable PyIceberg uses (ingestion.common.iceberg), so both always see the same tables.
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=${ENV:ICEBERG_CATALOG_NAME}
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=${ENV:ICEBERG_CATALOG_JDBC_URL}
iceberg.jdbc-catalog.connection-user=${ENV:ICEBERG_CATALOG_DB_USER}
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_CATALOG_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=${ENV:ICEBERG_WAREHOUSE}

# Data files: Trino's native S3 file system, path-style (SeaweedFS in dev, R2 in prod).
fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.path-style-access=true
s3.region=${ENV:S3_REGION}
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
