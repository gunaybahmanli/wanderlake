# Wanderlake local stack.
# Run from the repo root via the Makefile (make up / make down), which passes
# --env-file .env and --profile. Relative paths below resolve from this folder.
#
# Memory budget (WSL2 = 4 GB). Limits: core = postgres 512m + seaweedfs 640m + airflow 1.5g;
# query = trino 1.2g. One-shot init containers run for a few seconds only.
# Several profiles at once: make up PROFILE="core query".

name: wanderlake

services:
  # ---------------------------------------------------------------------------
  # Postgres 17 + pgvector: Airflow metadata DB ("airflow") and app DB ("wanderlake")
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wanderlake}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      ICEBERG_CATALOG_DB_USER: ${ICEBERG_CATALOG_DB_USER:-iceberg}
      ICEBERG_CATALOG_DB_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD:?set ICEBERG_CATALOG_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # SeaweedFS: S3-compatible object storage (master + volume + filer + S3 gateway
  # in one "weed server" process). Path-style addressing (no -s3.domainName set).
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 640m
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    # Render the S3 identity config from .env, then hand off to the image's entrypoint.
    entrypoint: ["/bin/sh", "/seaweedfs/start.sh"]
    command:
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=0
    ports:
      - "${S3_PORT:-8333}:8333"   # S3 API
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888" # Filer web UI (browse buckets and files)
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333" # Master web UI (cluster status)
    volumes:
      - s3_data:/data
      - ./seaweedfs/start.sh:/seaweedfs/start.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: create the buckets (idempotent), then exit.
  # No healthcheck and no restart: it is a job, not a long-running service.
  s3-init:
    image: amazon/aws-cli:2.41.0
    profiles: ["core"]
    restart: "no"
    mem_limit: 256m
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKETS: ${S3_BUCKETS:-raw lakehouse}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws configure set default.s3.addressing_style path
        for b in $$S3_BUCKETS; do
          if aws s3api head-bucket --bucket "$$b" 2>/dev/null; then
            echo "bucket $$b already exists"
          else
            aws s3api create-bucket --bucket "$$b" >/dev/null && echo "created bucket $$b"
          fi
        done

  # ---------------------------------------------------------------------------
  # Query profile: Trino + Apache Iceberg (see docs/adr/0003)
  # ---------------------------------------------------------------------------

  # One-shot: create the Iceberg JDBC catalog database, role and tables (idempotent). Init scripts
  # only run on a fresh Postgres volume; this applies the same script to an existing one.
  catalog-db-init:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    profiles: ["query"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ICEBERG_CATALOG_DB_USER: ${ICEBERG_CATALOG_DB_USER:-iceberg}
      ICEBERG_CATALOG_DB_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD:?set ICEBERG_CATALOG_DB_PASSWORD in .env}
    entrypoint: ["bash", "/scripts/02-iceberg-catalog.sh"]
    volumes:
      - ./postgres/init/02-iceberg-catalog.sh:/scripts/02-iceberg-catalog.sh:ro

  # Trino single node (coordinator + worker). Memory: 768 MB heap (jvm.config) plus ~450 MB
  # non-heap JVM overhead (metaspace, threads, code cache, direct buffers) = 1.2 GB limit.
  # restart "no": after a WSL restart, Trino stays down instead of bringing the whole ~3 GB stack
  # back at once (which put WSL into a restart loop). Start it when needed: make up PROFILE=...
  trino:
    image: trinodb/trino:484
    profiles: ["query"]
    restart: "no"
    mem_limit: 1229m
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      catalog-db-init:
        condition: service_completed_successfully
    environment:
      # Read by catalog/iceberg.properties through ${ENV:...}
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:?set ICEBERG_CATALOG_NAME in .env}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?set ICEBERG_WAREHOUSE in .env}
      ICEBERG_CATALOG_DB_USER: ${ICEBERG_CATALOG_DB_USER:-iceberg}
      ICEBERG_CATALOG_DB_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD:?set ICEBERG_CATALOG_DB_PASSWORD in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "${TRINO_PORT:-8081}:8080" # 8080 on the host is Airflow
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro # replaces the image's demo catalogs
      - ./trino/sql:/opt/wanderlake/sql:ro
    healthcheck:
      # The image's own check: /v1/info reports "starting": false once queries are accepted.
      # (Bash builtins only: the image has no grep.)
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Apache Airflow 3 (standalone: api-server, scheduler, dag-processor, triggerer)
  # ---------------------------------------------------------------------------
  airflow:
    # Custom image: official apache/airflow 3.4.0 + PyIceberg, Cosmos, dbt (infra/airflow).
    # Rebuild after changing infra/airflow: make build
    build: ../airflow
    image: wanderlake-airflow:local
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1536m # measured 0.9-1.1 GiB; lowered from 2g to leave room on a 4 GB WSL machine
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      # Wanderlake ingestion package (mounted below), importable from DAGs and tasks.
      PYTHONPATH: /opt/wanderlake/ingestion/src
      # Generic S3 settings for the ingestion package (internal endpoint inside Docker).
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Iceberg catalog for PyIceberg (ingestion.common.iceberg); same catalog as Trino.
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:?set ICEBERG_CATALOG_NAME in .env}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?set ICEBERG_WAREHOUSE in .env}
      ICEBERG_CATALOG_DB_HOST: postgres
      ICEBERG_CATALOG_DB_USER: ${ICEBERG_CATALOG_DB_USER:-iceberg}
      ICEBERG_CATALOG_DB_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD:?set ICEBERG_CATALOG_DB_PASSWORD in .env}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__PARALLELISM: "2" # at most 2 task processes at once (memory)
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW__CORE__FERNET_KEY in .env}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:?set AIRFLOW__API__SECRET_KEY in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?set AIRFLOW__API_AUTH__JWT_SECRET in .env}
      AIRFLOW__API__WORKERS: "1" # keep the api-server small on a 4 GB machine
      # Simple auth manager (Airflow 3 default): one admin user, password from .env.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    command:
      - bash
      - -c
      - |
        printf '{"%s": "%s"}\n' "$$AIRFLOW_ADMIN_USER" "$$AIRFLOW_ADMIN_PASSWORD" \
          > "$$AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"
        exec airflow standalone
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../ingestion/src:/opt/wanderlake/ingestion/src:ro
      - ../../config:/opt/wanderlake/config:ro # cities.yaml, read by ingestion.config
      - ../../tests:/opt/wanderlake/tests:ro # for make test-dags
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  pg_data:
  s3_data:
