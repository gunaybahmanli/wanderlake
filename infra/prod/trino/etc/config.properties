# Prod Trino (ADR-0012): single node, started fresh by every run of
# .github/workflows/prod-pipeline.yml on a GitHub-hosted runner (4 vCPU, about 16 GB RAM) and
# removed with it. Same image and the same catalog file as dev (infra/compose/trino/catalog);
# only memory is larger than on the laptop (infra/compose/trino/etc, 768 MB heap).
#
# Memory (see also jvm.config):
#   container limit (docker run --memory)  10 GB  leaves about 6 GB for the runner, Python, dbt
#   JVM heap                                8 GB  -Xms8G/-Xmx8G
#   query.max-memory-per-node               4 GB  user memory one query may use
#   query.max-memory                        4 GB  same value: there is only one node
#   memory.heap-headroom-per-node           2 GB  heap kept free for Trino's own allocations
#   Trino requires per-node + headroom < heap: 4 GB + 2 GB = 6 GB < 8 GB.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

query.max-memory-per-node=4GB
query.max-memory=4GB
memory.heap-headroom-per-node=2GB
