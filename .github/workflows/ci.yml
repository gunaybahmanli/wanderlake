name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Must match the base image in infra/airflow/Dockerfile (update both when Dependabot bumps it).
  AIRFLOW_VERSION: "3.4.0"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: make test

  dag-integrity:
    name: DAG integrity (Airflow 3.4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # The DAGs folder holds helper modules (wanderlake_assets), as in the container.
      PYTHONPATH: ingestion/src:airflow/dags
      # wanderlake_transform (Cosmos) renders from a manifest built below, never by running dbt.
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_MANIFEST_PATH: ${{ github.workspace }}/dbt/target/manifest.json
      DBT_EXECUTABLE_PATH: ${{ github.workspace }}/.venv-dbt/bin/dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: airflow-${{ env.AIRFLOW_VERSION }}
          cache-dependency-glob: |
            .github/workflows/ci.yml
            infra/airflow/requirements.txt
            infra/airflow/requirements-dbt.txt

      - name: Install Airflow and the image's extra packages with official constraints
        run: |
          uv venv .venv-airflow --python "$PYTHON_VERSION"
          uv pip install --python .venv-airflow \
            "apache-airflow==${AIRFLOW_VERSION}" pytest \
            -r infra/airflow/requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Build the dbt manifest for Cosmos (dbt deps + parse, no database needed)
        run: |
          uv venv .venv-dbt --python "$PYTHON_VERSION"
          uv pip install --python .venv-dbt -r infra/airflow/requirements-dbt.txt
          cd dbt && "$DBT_EXECUTABLE_PATH" deps && "$DBT_EXECUTABLE_PATH" parse

      - name: Run DAG integrity tests
        run: .venv-airflow/bin/python -m pytest tests/dags -v

  tofu:
    name: OpenTofu checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - name: Init (no backend, no credentials)
        run: tofu init -backend=false -input=false

      - name: Format check
        run: tofu fmt -check -recursive -diff

      - name: Validate
        run: tofu validate

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (fixture data, no Supabase or secrets needed)
        run: npm run build
        env:
          DATA_SOURCE: fixture

  airflow-image:
    name: Airflow image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push, GitHub Actions layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/airflow
          tags: wanderlake-airflow:ci
          load: true
          push: false
          cache-from: type=gha,scope=airflow-image
          cache-to: type=gha,mode=max,scope=airflow-image

      - name: Check libraries inside the image
        run: |
          docker run --rm --entrypoint python wanderlake-airflow:ci -c \
            "import pyiceberg, cosmos; print('pyiceberg', pyiceberg.__version__, '| cosmos', cosmos.__version__)"
          docker run --rm --entrypoint /opt/dbt-venv/bin/dbt wanderlake-airflow:ci --version
          # python -m pip, not a bare "pip": the base image PATH starts with /root/bin, which the
          # airflow user cannot read, and a bare command lookup stops there (Permission denied).
          docker run --rm --entrypoint python wanderlake-airflow:ci -m pip check

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: dbt
          cache-dependency-glob: infra/airflow/requirements-dbt.txt

      - name: Install dbt (same pins as the image's /opt/dbt-venv)
        run: |
          uv venv .venv-dbt --python "$PYTHON_VERSION"
          uv pip install --python .venv-dbt -r infra/airflow/requirements-dbt.txt

      - name: dbt deps and parse (no database needed)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          ../.venv-dbt/bin/dbt deps
          ../.venv-dbt/bin/dbt parse
