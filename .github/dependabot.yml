version: 2
updates:
  # GitHub Actions used in .github/workflows (SHA pins are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]

  # Website dependencies (web/package.json + package-lock.json).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      web:
        patterns: ["*"]
    ignore:
      # typescript-eslint (used by eslint-config-next) supports TypeScript >=4.8.4 <6.1.0.
      # Remove when its peerDependencies allow TypeScript 6.1+ / 7.
      - dependency-name: typescript
        versions: [">= 6.1"]
  # ESLint stays on 10 (9 is end-of-life). eslint-config-next 16.4.6 bundles eslint-plugin-import,
  # -jsx-a11y and -react, which do not declare ESLint 10 yet: npm ci prints peer-dependency
  # warnings, but lint runs. If a plugin breaks, the CI "Web build" job fails.

  # Base image of the custom Airflow image (tag and digest in infra/airflow/Dockerfile).
  # When it bumps Airflow itself, also update AIRFLOW_VERSION in .github/workflows/ci.yml.
  - package-ecosystem: docker
    directory: /infra/airflow
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
