[project]
name = "wanderlake"
version = "0.1.0"
description = "Global travel intelligence platform on an open-source lakehouse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "sqlfluff",
    "pre-commit",
    "pytest",
]

[tool.uv]
# The repo root is a workspace of tooling, not an installable package (yet).
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "ingestion/tests"]
