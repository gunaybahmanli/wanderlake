version: 2

models:
  - name: stg_frankfurter_rates
    description: >
      ECB euro reference rates (Frankfurter) with one row per actual rate_date and currency:
      weekend and holiday repeats from bronze are collapsed, keeping the latest load. A view.
    columns:
      - name: rate_date
        description: Business day the rates are for.
        data_tests: [not_null]
      - name: currency_code
        description: ISO 4217 code of the quoted currency.
        data_tests: [not_null]
      - name: units_per_eur
        description: Units of the currency per 1 EUR.
        data_tests: [not_null]
      - name: requested_date
        description: Run date of the bronze row that was kept.
      - name: _loaded_at
        description: When the kept bronze row was loaded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_code]

  - name: stg_cbar_rates
    description: >
      CBAR official rates (AZN per foreign unit) with one row per actual rate_date and
      currency; weekend and holiday repeats collapsed, keeping the latest load. A view.
    columns:
      - name: rate_date
        description: Date stated in the CBAR file.
        data_tests: [not_null]
      - name: currency_code
        description: ISO 4217 code of the foreign currency.
        data_tests: [not_null]
      - name: currency_name
        description: Name as published (Azerbaijani).
      - name: nominal
        description: Number of units the rate is quoted for (1 or 100).
      - name: rate_azn
        description: AZN for `nominal` units, as published.
      - name: azn_per_unit
        description: AZN for 1 unit of the currency (rate_azn / nominal).
        data_tests: [not_null]
      - name: requested_date
        description: Run date of the bronze row that was kept.
      - name: _loaded_at
        description: When the kept bronze row was loaded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_code]

  - name: stg_rest_countries
    description: REST Countries, the latest weekly snapshot only; one row per country. A view.
    columns:
      - name: cca2
        description: ISO 3166-1 alpha-2 code.
        data_tests: [unique, not_null]
      - name: snapshot_date
        description: "(draft) Date of the latest weekly snapshot."
      - name: cca3
        description: "(draft) ISO 3166-3 country code."
      - name: name_common
        description: "(draft) Common name of the country."
      - name: name_official
        description: "(draft) Official name of the country."
      - name: capital
        description: "(draft) Capital city of the country."
      - name: region
        description: "(draft) Geographical region of the country."
      - name: subregion
        description: "(draft) Subregion of the country."
      - name: population
        description: "(draft) Population of the country."
      - name: area_km2
        description: "(draft) Area of the country in square kilometers."
      - name: lat
        description: "(draft) Latitude of the country."
      - name: lon
        description: "(draft) Longitude of the country."
      - name: flag_png_url
        description: "(draft) URL of the country's flag."
      - name: independent
        description: "(draft) Boolean indicating if the country is independent."
      - name: un_member
        description: "(draft) Boolean indicating if the country is a member of the United Nations."
      - name: currencies_json
        description: "(draft) JSON array of currency codes, names, and symbols."
      - name: languages_json
        description: "(draft) JSON array of language codes, names, and ISO 639-1 codes."
      - name: _loaded_at
        description: "(draft) Timestamp indicating when the data was loaded."

  - name: stg_geonames_cities
    description: GeoNames cities15000, the latest monthly snapshot only; one row per place. A view.
    columns:
      - name: geonameid
        description: GeoNames id of the place.
        data_tests: [unique, not_null]
      - name: snapshot_date
        description: "(draft) Date of the latest monthly snapshot of GeoNames cities."
      - name: country_code
        description: "(draft) ISO 3166-1 alpha-2 country code."
      - name: admin1_code
        description: "(draft) First-level administrative division code."
      - name: population
        description: "(draft) Population of the city."
      - name: elevation
        description: "(draft) Elevation of the city."
      - name: timezone
        description: "(draft) Time zone of the city."
      - name: _loaded_at
        description: "(draft) Timestamp when the data was loaded."
      - name: name
        description: "(draft) The name of the city, in the local language."
      - name: dem
        description: "(draft) The population of the city, in the local demography unit."

  - name: stg_open_meteo_history
    description: Open-Meteo history, one row per (city_id, weather_date), latest load kept. A view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, weather_date]
    columns:
      - name: temperature_2m_max
        description: "(draft) Maximum 2m Temperature."
      - name: temperature_2m_min
        description: "(draft) Minimum 2m Temperature."
      - name: temperature_2m_mean
        description: "(draft) Mean 2m Temperature."
      - name: precipitation_hours
        description: "(draft) Total Precipitation Hours."
      - name: wind_speed_10m_max
        description: "(draft) Maximum 10m Wind Speed."
      - name: city_id
        description: "(draft) City ID (varchar)."
      - name: weather_date
        description: "(draft) Weather Date (date)."
      - name: weather_code
        description: "(draft) Weather Code (integer)."
      - name: precipitation_sum
        description: "(draft) Precipitation Sum (double)."
      - name: rain_sum
        description: "(draft) Rain Sum (double)."
      - name: snowfall_sum
        description: "(draft) Snowfall Sum (double)."
      - name: sunshine_duration
        description: "(draft) Sunshine Duration (double)."
      - name: _loaded_at
        description: "(draft) Loaded At (timestamp(6) with time zone)."

  - name: stg_open_meteo_forecast
    description: Open-Meteo forecasts, one row per (run_date, city_id, forecast_date). A view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_date, city_id, forecast_date]
    columns:
      - name: run_date
        description: "(draft) Date of the forecast run."
      - name: forecast_date
        description: "(draft) Date of the forecast."
      - name: temperature_2m_max
        description: "(draft) Maximum 2m temperature."
      - name: temperature_2m_min
        description: "(draft) Minimum 2m temperature."
      - name: temperature_2m_mean
        description: "(draft) Mean 2m temperature."
      - name: precipitation_hours
        description: "(draft) Total precipitation hours."
      - name: wind_speed_10m_max
        description: "(draft) Maximum 10m wind speed."
      - name: sunshine_duration
        description: "(draft) Duration of sunshine in hours."
      - name: uv_index_max
        description: "(draft) Maximum UV index."
      - name: precipitation_probability_max
        description: "(draft) Maximum probability of precipitation."
      - name: city_id
        description: "(draft) City ID (varchar)."
      - name: weather_code
        description: "(draft) Weather Code (integer)."
      - name: precipitation_sum
        description: "(draft) Total Precipitation (double)."
      - name: rain_sum
        description: "(draft) Total Rain (double)."
      - name: snowfall_sum
        description: "(draft) Total Snowfall (double)."
      - name: _loaded_at
        description: "(draft) Loaded At (timestamp with time zone)."

  - name: stg_fcdo_advice
    description: FCDO travel advice, every daily snapshot; one row per (snapshot_date, country_code). A view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, country_code]
    columns:
      - name: snapshot_date
        description: "(draft) Date of the daily travel advice snapshot."
      - name: country_code
        description: "(draft) Country code for the travel advice."
      - name: slug
        description: "(draft) Unique identifier for the travel advice."
      - name: title
        description: "(draft) Title of the travel advice."
      - name: public_updated_at
        description: "(draft) Timestamp when the travel advice was last updated."
      - name: change_description
        description: "(draft) Description of the changes made to the travel advice."
      - name: alert_status_json
        description: "(draft) JSON representation of the travel alert status."
      - name: parts_json
        description: "(draft) JSON representation of the travel advice parts."
      - name: _loaded_at
        description: "(draft) Timestamp when the data was loaded."

  - name: stg_wikimedia_city_images
    description: Wikimedia city images, every weekly snapshot; one row per (snapshot_date, city_id). A view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, city_id]
    columns:
      - name: snapshot_date
        description: "(draft) Date of the weekly snapshot."
      - name: city_id
        description: "(draft) Unique identifier for the city."
      - name: wikidata_id
        description: "(draft) Wikidata identifier for the city."
      - name: file_name
        description: "(draft) Name of the image file."
      - name: selection
        description: "(draft) Type of image selection (override, normal, preferred)."
      - name: candidates_json
        description: "(draft) JSON representation of image candidates."
      - name: file_page_url
        description: "(draft) URL of the image file on Wikimedia Commons."
      - name: original_url
        description: "(draft) URL of the original image."
      - name: original_width
        description: "(draft) Width of the original image."
      - name: original_height
        description: "(draft) Height of the original image."
      - name: thumb_url
        description: "(draft) URL of the thumbnail image."
      - name: thumb_width
        description: "(draft) Width of the thumbnail image."
      - name: thumb_height
        description: "(draft) Height of the thumbnail image in pixels."
      - name: mime
        description: "(draft) File format (e.g. image/jpeg)."
      - name: license_short_name
        description: "(draft) Short name of the license (e.g. CC BY-SA 4.0)."
      - name: license_code
        description: "(draft) Code of the license (e.g. cc-by-sa-4.0)."
      - name: license_url
        description: "(draft) URL of the license."
      - name: license_family
        description: "(draft) Family of the license (e.g. cc-by-sa, cc-by)."
      - name: artist_html
        description: "(draft) HTML link to the artist's page."
      - name: credit_html
        description: "(draft) HTML text indicating the source of the image."
      - name: attribution_required
        description: "(draft) Whether attribution is required for the image."
      - name: usage_terms
        description: "(draft) Terms under which the image can be used."
