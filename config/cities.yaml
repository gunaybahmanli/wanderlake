# Wanderlake cities: the single source of truth for all connectors.
# Every pipeline that is city-aware (rates, weather, listings, ...) reads this file through
# ingestion.config.load_cities(); never hard-code a city list anywhere else.
#
# Fields (validated by ingestion/src/ingestion/config.py):
#   id             lowercase kebab-case slug, unique (used in object keys and table rows)
#   name           English name
#   country_code   ISO 3166-1 alpha-2
#   timezone       IANA time zone name
#   latitude       city centre, decimal degrees, 4 decimals (source: Wikidata P625)
#   longitude      city centre, decimal degrees, 4 decimals (source: Wikidata P625)
#   currency       ISO 4217 code
#   rate_source    "ecb" if the ECB euro reference rates include the currency (or it is EUR),
#                  otherwise "cbar" (Central Bank of Azerbaijan official rates)
#   inside_airbnb  true if the city is on insideairbnb.com "Get the Data"; null = not checked
#   geonames_id    GeoNames geonameid of the city (cities15000 dump). Matched by country, name and
#                  closest distance, preferring PPLC/PPLA/PPL (ingestion.sources.geonames.match_city).
#                  Dubai's GeoNames point is about 21 km from our centre; it is the right place.
#
# Verified on 2026-11-18 (UTC): rate_source against the ECB daily reference rates of 2026-11-18
# (AZN and AED are not included; CBAR publishes AED), inside_airbnb against the
# Get the Data page (121 cities; Baku, Dubai and Seoul are not listed).

cities:
  - id: baku
    name: Baku
    country_code: AZ
    timezone: Asia/Baku
    latitude: 40.3667
    longitude: 49.8352
    currency: AZN
    rate_source: cbar
    inside_airbnb: false
    geonames_id: 587084

